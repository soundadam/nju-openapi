openapi: 3.1.0
info:
  title: 我的课表 wdkb
  version: 0.1.0
  summary: ehall 我的课表 / 学期
  description: |
    非官方。服务大厅「我的课表」。

    第一刀只收 list/download 级接口。免修不免考在另一个应用 `mtxkbl`，写接口不收录。

    Playground 为 simple。对照：`nju-cli ehall my-course-schedule`。
  x-source: nju-cli crates/ehall/src/my_course_schedule.rs
  x-nju-cli: v1.6
  x-captured: "2026-08-24"
  x-appId: "4770397878132218"
  x-defaultRoleId: "20230211151103310"
servers:
  - url: https://ehallapp.nju.edu.cn
security:
  - ehallCookies: []
tags:
  - name: 会话
  - name: 学期
  - name: 课表
paths:
  /appShow:
    servers:
      - url: https://ehall.nju.edu.cn
    get:
      tags: [会话]
      operationId: wdkbAppShow
      summary: 打开我的课表
      parameters:
        - name: appId
          in: query
          required: true
          schema:
            type: string
            const: "4770397878132218"
      responses:
        "200":
          description: 应用入口
        "302":
          description: 跳转

  "/jwapp/sys/wdkb/*default/index.do":
    get:
      tags: [会话]
      operationId: wdkbIndex
      summary: 我的课表应用首页
      parameters:
        - name: _roleId
          in: query
          required: true
          schema:
            type: string
            default: "20230211151103310"
        - name: EMAP_LANG
          in: query
          schema:
            type: string
            default: zh
        - name: THEME
          in: query
          schema:
            type: string
            default: ""
      responses:
        "200":
          description: 应用页 HTML

  /jwapp/sys/funauthapp/api/changeAppRole/wdkb/{roleId}.do:
    get:
      tags: [会话]
      operationId: wdkbChangeAppRole
      summary: 切换我的课表角色
      description: nju-cli 对 wdkb 用 GET。默认 roleId `20230211151103310`。
      parameters:
        - name: roleId
          in: path
          required: true
          schema:
            type: string
            default: "20230211151103310"
      responses:
        "200":
          description: 角色已切换

  /jwapp/sys/wdkb/modules/jshkcb/xnxqcx.do:
    post:
      tags: [学期]
      operationId: wdkbListTerms
      summary: 学期列表
      description: |
        action `xnxqcx`。nju-cli 只 POST `*order=-DM`。row 用 `DM` / `MC`，不是 `XNXQDM`。
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                "*order":
                  type: string
                  default: "-DM"
            examples:
              default:
                value:
                  "*order": "-DM"
      responses:
        "200":
          description: 信封 datas.xnxqcx
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TermListEnvelope"
              examples:
                ok:
                  value:
                    code: "0"
                    datas:
                      xnxqcx:
                        totalSize: 1
                        rows:
                          - DM: "2025-2026-1"
                            MC: "2025-2026学年第一学期"
                            XNDM: "2025-2026"
                            XQDM: "1"

  /jwapp/sys/wdkb/modules/jshkcb/dqxnxq.do:
    post:
      tags: [学期]
      operationId: wdkbCurrentTerm
      summary: 当前学期
      description: action `dqxnxq`。nju-cli 空 form。
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: 信封 datas.dqxnxq
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentTermEnvelope"

  /jwapp/sys/wdkb/modules/xskcb/cxxsjbxx.do:
    post:
      tags: [课表]
      operationId: wdkbStudentInfo
      summary: 当前学生基本信息
      description: action `cxxsjbxx`。nju-cli 空 form，取 rows[0]。
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: 信封 datas.cxxsjbxx
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentInfoEnvelope"
              examples:
                ok:
                  value:
                    code: "0"
                    datas:
                      cxxsjbxx:
                        totalSize: 1
                        rows:
                          - XH: "000000000"
                            XM: "示例"

  /jwapp/sys/wdkb/modules/xskcb/cxxskclb.do:
    post:
      tags: [课表]
      operationId: wdkbListMyCourses
      summary: 我的课表列表
      description: |
        action `cxxskclb`。nju-cli 会同时传顶级 `XNXQDM` 和 `querySetting` 里的同等条件。
        form 还有 `pageNumber` / `pageSize`，不传 `*order`。
        `querySetting` 示例：`[{"name":"XNXQDM","value":"2025-2026-1","linkOpt":"AND","builder":"equal"}]`。
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [XNXQDM, querySetting, pageNumber, pageSize]
              properties:
                XNXQDM:
                  type: string
                  example: "2025-2026-1"
                querySetting:
                  type: string
                pageNumber:
                  type: string
                  default: "1"
                pageSize:
                  type: string
                  default: "10"
            examples:
              current:
                value:
                  XNXQDM: "2025-2026-1"
                  querySetting: '[{"name":"XNXQDM","value":"2025-2026-1","linkOpt":"AND","builder":"equal"}]'
                  pageNumber: "1"
                  pageSize: "50"
      responses:
        "200":
          description: 信封 datas.cxxskclb
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyCourseListEnvelope"
              examples:
                ok:
                  value:
                    code: "0"
                    datas:
                      cxxskclb:
                        totalSize: 1
                        pageNumber: 1
                        pageSize: 50
                        rows:
                          - KCH: "00000000H"
                            JXBID: "2025-2026-1-00000000H-001"
                            JXBMC: "示例课程-001"
                            KCM: "示例课程"
                            SKJS: "示例教师"
                            ZCXQJCDD: "1-16周 星期一 3-4节 示例楼101"
                            PKDWDM: "400000"
                            PKDWDM_DISPLAY: "示例院系"
                            XF: "2"
                            XKLY: "1"
                            XKLY_DISPLAY: "主修"
                            SKSM: null
                            TKJG: null
                            QMKSXX: null
                            QTXX: null
                            JSHS: null
                            XNXQDM: "2025-2026-1"
                            KXH: "001"
                            SFKT: "0"

  /jwapp/sys/wdkb/modules/xskcb/cxkcxx.do:
    post:
      tags: [课表]
      operationId: wdkbCourseInfo
      summary: 课程信息
      description: action `cxkcxx`。form 字段 `KCH`。nju-cli 详情命令会再打这一下。
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [KCH]
              properties:
                KCH:
                  type: string
                  example: "00000000H"
      responses:
        "200":
          description: 信封 datas.cxkcxx
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionEnvelope"

  /jwapp/sys/wdkb/modules/xskcb/cxkczjjcxx.do:
    post:
      tags: [课表]
      operationId: wdkbCourseTextbook
      summary: 课程教材信息
      description: action `cxkczjjcxx`。form 字段 `KCH`。
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [KCH]
              properties:
                KCH:
                  type: string
                  example: "00000000H"
      responses:
        "200":
          description: 信封 datas.cxkczjjcxx
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionEnvelope"

  "/jwapp/sys/wdkb/*default/public/commonpage/kblb/kblbIndexPage.html":
    get:
      tags: [课表]
      operationId: wdkbExamNotesHtml
      summary: 课表页考试说明 HTML
      description: |
        页面底部考试说明来自这块 HTML 里的 `.kssm-container`。
        nju-cli `exam-notes` 拉 HTML 再抽文本。不是 JSON 信封。
      responses:
        "200":
          description: HTML
          content:
            text/html:
              schema:
                type: string

components:
  securitySchemes:
    ehallCookies:
      type: apiKey
      in: cookie
      name: CASTGC
      description: 占位。真正请求需要 appShow 之后的 ehallapp 会话 cookie。见认证一章。
  schemas:
    Term:
      type: object
      additionalProperties: true
      required: [DM, MC]
      properties:
        DM:
          type: string
          description: 学期代码，等同课表里的 XNXQDM
        MC:
          type: string
        XNDM:
          type: [string, "null"]
        XQDM:
          type: [string, "null"]
    StudentInfo:
      type: object
      additionalProperties: true
      required: [XH]
      properties:
        XH:
          type: string
        XM:
          type: [string, "null"]
    MyCourse:
      type: object
      additionalProperties: true
      required: [KCH, JXBID, JXBMC]
      properties:
        KCH:
          type: string
        JXBID:
          type: string
          description: 教学班
        JXBMC:
          type: string
        KCM:
          type: [string, "null"]
        SKJS:
          type: [string, "null"]
          description: 上课教师
        ZCXQJCDD:
          type: [string, "null"]
          description: 周次星期节次地点
        PKDWDM:
          type: [string, "null"]
        PKDWDM_DISPLAY:
          type: [string, "null"]
        XF:
          type: [string, number, "null"]
        XKLY:
          type: [string, "null"]
        XKLY_DISPLAY:
          type: [string, "null"]
        SKSM:
          type: [string, "null"]
        TKJG:
          type: [string, "null"]
        QMKSXX:
          type: [string, "null"]
          description: 期末考试信息
        QTXX:
          type: [string, "null"]
        JSHS:
          type: [string, "null"]
          description: 教师联系
        XNXQDM:
          type: [string, "null"]
        KXH:
          type: [string, "null"]
        SFKT:
          type: [string, "null"]
    EhallPage:
      type: object
      properties:
        totalSize:
          type: integer
        pageNumber:
          type: integer
        pageSize:
          type: integer
        rows:
          type: array
          items: {}
        extParams: {}
    TermListEnvelope:
      type: object
      properties:
        code:
          type: string
          example: "0"
        datas:
          type: object
          properties:
            xnxqcx:
              allOf:
                - $ref: "#/components/schemas/EhallPage"
                - type: object
                  properties:
                    rows:
                      type: array
                      items:
                        $ref: "#/components/schemas/Term"
    CurrentTermEnvelope:
      type: object
      properties:
        code:
          type: string
        datas:
          type: object
          properties:
            dqxnxq:
              allOf:
                - $ref: "#/components/schemas/EhallPage"
                - type: object
                  properties:
                    rows:
                      type: array
                      items:
                        $ref: "#/components/schemas/Term"
    StudentInfoEnvelope:
      type: object
      properties:
        code:
          type: string
        datas:
          type: object
          properties:
            cxxsjbxx:
              allOf:
                - $ref: "#/components/schemas/EhallPage"
                - type: object
                  properties:
                    rows:
                      type: array
                      items:
                        $ref: "#/components/schemas/StudentInfo"
    MyCourseListEnvelope:
      type: object
      properties:
        code:
          type: string
        datas:
          type: object
          properties:
            cxxskclb:
              allOf:
                - $ref: "#/components/schemas/EhallPage"
                - type: object
                  properties:
                    rows:
                      type: array
                      items:
                        $ref: "#/components/schemas/MyCourse"
    ActionEnvelope:
      type: object
      additionalProperties: true
      properties:
        code:
          type: string
          example: "0"
        datas:
          type: object
          additionalProperties: true
